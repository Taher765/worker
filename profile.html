<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <!--=========== Start Popup ========= -->

    <!-- Start modal  transactions -->
    <div class="overlay modal-transactions">
      <div class="popup shadow-sm">
        <h3>اضف مبلغ</h3>
        <input
          class="form-control my-2 input-amount"
          type="text"
          name=""
          id=""
          placeholder="ادخل مبلغ العمليه"
        />
        <input
          class="form-control my-2 note"
          type="text"
          name=""
          id=""
          placeholder="سبب العمليه"
        />
        <div>
          <button
            data-name="transactions"
            class="btn btn-success btn-apllay-transactions"
          >
            تطبيق
          </button>
          <button
            data-name="transactions"
            class="btn-exit-transactions btn btn-dark"
          >
            خروج
          </button>
        </div>
      </div>
    </div>

    <!-- Start Header -->
    <header class="header shadow-sm p-3">
      <div class="container">
        <div class="navbar">
          <h3 class="logo">
            <!-- in js -->
          </h3>
          <div class="add-worker">
            <a href="index.html" class="btn btn-danger">رجوع </a>
          </div>
        </div>
      </div>
    </header>

    <div class="body">
      <div class="container">
        <div class="oldWageDev">
          <div class="border m-2 p-2 rounded">
            <h3>تاريخ اليوميات</h3>
            <div class="old-data-wage border-bottom p-2"></div>
            <br />
            <button class="btnColseOldWage btn btn-danger">اخفاء</button>
          </div>
        </div>
        <div
          class="border rounded m-3 p-3 d-flex align-items-center justify-content-between"
        >
          <div>
            <h3 class="data-wage">
              <!-- js  -->
            </h3>
            <h4 class="wage-sallery">
              <!-- js -->
            </h4>
            <button class="old-wage btn btn-warning">
              عرض اليوميات القديمه
            </button>
          </div>
          <div class="text-center">
            <button
              class="btn btn-info btn-displayEdit mb-2"
              data-name="sallery"
            >
              تعديل اليوميه
            </button>
            <!-- EDIT WAGE -->
            <div class="edit-sallary">
              <input class="form-control edit-wage-input mb-2" type="text" />
              <button class="btn btn-success btn-edit-wage" data-name="sallery">
                تطبيق
              </button>
              <button class="btn btn-danger exit" data-name="sallery">
                خروج
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="container">
        <h2 class="my-4 text-center">تفاصيل ماليه</h2>

        <div class="row gap-2 align-items-center justify-content-center">
          <div class="col-3 border rounded">
            <div class="item p-3">
              <h4 class="text-center grossEarned"></h4>
            </div>
          </div>
          <div class="col-3 border rounded">
            <div class="item p-3">
              <h4 class="text-center totalDiscounts"></h4>
            </div>
          </div>
          <div class="col-3 border rounded">
            <div class="item p-3">
              <h4 class="text-center totalRewards"></h4>
            </div>
          </div>
        </div>

        <div class="row mt-2 gap-2 align-items-center justify-content-center">
          <div class="col-3 border rounded">
            <div class="item p-3">
              <h4 class="totalDue text-center">
                <!-- js -->
              </h4>
            </div>
          </div>
          <div class="col-3 border rounded">
            <div class="item p-3">
              <h4 class="text-center totalPaid"></h4>
            </div>
          </div>
          <div class="col-3 border rounded">
            <div class="item p-3">
              <h4 class="text-center remaining"></h4>
            </div>
          </div>
        </div>
      </div>
      <div class="container">
        <div
          class="prosessing py-4 d-flex align-items-center justify-content-center gap-4"
        >
          <button
            data-transactions="payment"
            data-name="transactions"
            class="btn-payment btn btn-success"
          >
            دفع جزء
          </button>
          <button
            data-transactions="reward"
            data-name="transactions"
            class="btn-reward btn btn-warning"
          >
            مكافأه
          </button>
          <button
            data-transactions="deduction"
            data-name="transactions"
            class="btn-deduction btn btn-danger"
          >
            خصم
          </button>
        </div>
      </div>
    </div>

    <!-- Start History -->
    <div class="hestory">
      <div class="popup-transaction">
        <div class="form-group edit-transaction">
          <select class="form-control select-type my-1">
            <option value="payment">دفعه</option>
            <option value="reward">مكافأه</option>
            <option value="deduction">خصم</option>
          </select>
          <input
            type="text"
            class="form-control my-1 input-edit-amount"
            placeholder="تعديل المبلغ"
          />
          <input
            type="text"
            class="form-control input-edit-note my-1"
            placeholder="تعديل السبب"
          />
          <button class="btn btn-sm btn-success btn-apply-edit-transaction">
            تعديل
          </button>
          <button class="btn btn-close-transaction btn-sm btn-dark">
            خروج
          </button>
        </div>
      </div>
      <div class="container">
        <h2 class="my-4 text-center">سجل عمليات العامل</h2>
        <div class="table-responsive">
          <table
            class="table table-bordered table-striped table-hover text-center align-middle"
          >
            <thead>
              <tr class="">
                <th>النوع</th>
                <th>المبلغ</th>
                <th>السبب</th>
                <th>التاريخ</th>
                <th>اجراءات</th>
              </tr>
            </thead>

            <tbody class="table-profile"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/toastify.js"></script>
    <script src="js/all.min.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
